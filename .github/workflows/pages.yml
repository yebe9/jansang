name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in dist/*.js api/*.mjs logbook/*.mjs logbook/public/*.js server.cjs; do node --check "$file"; done
      - name: Test motion and API boundaries
        run: node --test tests/*.test.cjs
      - name: Set up Python for CPU motion input tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CPU HumanML3D conversion and boundaries without model weights
        run: |
          python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "tqdm>=4.66"
          python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m motion_service.download_models --sources-only
          python -m unittest motion_service.test_preprocessing
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
